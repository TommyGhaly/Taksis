<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taksis CPP shots</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; background: #000; }
  body { font-family: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  /* ---------- Frame ---------- */
  .frame { position: relative; width: 1320px; height: 2868px; overflow: hidden;
    background: radial-gradient(1100px 900px at 50% 0%, var(--glow) 0%, transparent 70%), linear-gradient(180deg, #0b0d12 0%, #050608 100%); }
  .caption { position: absolute; top: 150px; left: 0; right: 0; text-align: center; padding: 0 100px; }
  .eyebrow { font-size: 38px; font-weight: 700; letter-spacing: 7px; text-transform: uppercase; color: var(--accent); margin-bottom: 34px; }
  .headline { font-family: -apple-system, "SF Pro Display", system-ui; font-size: 104px; line-height: 1.04; font-weight: 700; letter-spacing: -2.5px; }
  .sub { margin-top: 34px; font-size: 46px; line-height: 1.3; color: rgba(255,255,255,.62); font-weight: 400; }
  .device { position: absolute; left: 50%; top: 720px; width: 464px; height: 980px; transform-origin: top center; transform: translateX(-50%) scale(2.18);
    background: #050505; border-radius: 68px; padding: 12px; box-shadow: 0 0 0 1.5px #3a3a3e, 0 0 0 3px #111, 0 40px 120px rgba(0,0,0,.6); }
  .screen { position: relative; width: 440px; height: 956px; border-radius: 56px; overflow: hidden; background: #121212; }

  /* ---------- iOS chrome ---------- */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 62px; background: #1c1c1c; z-index: 5; }
  .status .time { position: absolute; left: 62px; top: 20px; font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
  .status .island { position: absolute; left: 50%; top: 13px; width: 126px; height: 37px; margin-left: -63px; background: #000; border-radius: 20px; }
  .status .icons { position: absolute; right: 30px; top: 22px; display: flex; gap: 6px; align-items: center; }
  .navbar { position: absolute; top: 62px; left: 0; right: 0; height: 40px; background: #1c1c1c; border-bottom: 1px solid #262626; z-index: 5;
    display: flex; align-items: center; justify-content: center; font-size: 17.5px; font-weight: 600; padding-bottom: 6px; }
  .navbar .burger { position: absolute; left: 13px; top: 6px; }
  .content { position: absolute; top: 102px; left: 0; right: 0; bottom: 90px; overflow: hidden; padding: 0 20px; }
  .content.full { bottom: 0; }
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: #222428; z-index: 5; display: flex; justify-content: space-around; padding: 18px 26px 0; }
  .tabbar svg { width: 25px; height: 25px; }
  .homebar { position: absolute; bottom: 8px; left: 50%; width: 156px; margin-left: -78px; height: 5px; border-radius: 3px; background: #555; z-index: 9; }

  /* ---------- App primitives ---------- */
  .card { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 14px; }
  .blue { color: #3b9dff; }
  .section-title { font-size: 21px; font-weight: 600; color: #3b9dff; margin: 18px 0 14px; }
  .row { display: flex; align-items: center; gap: 12px; height: 57px; padding: 0 16px; margin-bottom: 10px; font-size: 17.5px; font-weight: 500; }
  .row svg { flex: none; }
  .btn { display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 16px; font-weight: 600; height: 41px; background: rgba(255,255,255,.08); }
  .avatar { flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; overflow: hidden; }
  .avatar.ph { background: #5a5a5c; }
  .avatar.ph svg { width: 70%; height: 70%; margin-top: 14%; }
  .weekcard { display: flex; align-items: center; gap: 14px; padding: 13px 15px; margin-top: 12px; }
  .weekcard .lbl { font-size: 11px; letter-spacing: 1.4px; color: rgba(255,255,255,.55); font-weight: 500; }
  .weekcard .val { font-size: 16.5px; font-weight: 500; margin-top: 2px; }
  .change { margin-left: auto; background: rgba(20,126,251,.18); color: #147EFB; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 8px; display: flex; gap: 6px; align-items: center; }
  .chips { display: flex; gap: 7px; margin: 13px 0 4px; overflow: hidden; white-space: nowrap; }
  .chip { flex: none; border: 1px solid #2c2c2e; background: #1a1a1a; border-radius: 8px; font-size: 13.5px; font-weight: 500; padding: 7px 13px; }
  .chip.on { background: rgba(20,126,251,.18); border-color: rgba(20,126,251,.6); color: #4d9cff; }
  .classhead { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 12px; }
  .classhead h3 { font-size: 19px; font-weight: 600; color: #3b9dff; }
  .addpill { border: 1px solid rgba(20,126,251,.6); background: rgba(20,126,251,.12); color: #3b9dff; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 14px; }
  .student { padding: 14px 14px 14px; margin-bottom: 10px; }
  .student .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 16px; font-weight: 500; }
  .student .top .chev { margin-left: auto; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pair .btn.present { background: #147EFB; }
  .pair .btn.absent { background: #ff3b30; }
  .searchdock { position: absolute; left: 12px; right: 12px; bottom: 26px; z-index: 6; background: rgba(40,40,42,.92); border: 1px solid #333; border-radius: 22px; padding: 10px; display: flex; gap: 8px; }
  .searchdock .field { flex: 1; background: #3a3a3c; border-radius: 12px; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: rgba(255,255,255,.5); font-size: 15.5px; }
  .searchdock .fab { width: 38px; height: 38px; border-radius: 12px; background: #147EFB; display: flex; align-items: center; justify-content: center; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.72); z-index: 7; }
  .modal { position: absolute; left: 20px; right: 20px; z-index: 8; background: #1c1c1e; border-radius: 22px; border: 1px solid #2c2c2e; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- Icons (inline, stroke style approximating the app's Ionicons/Feather mix) ---------- */
const I = {
  burger: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',
  book: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#b5b5b8"><path d="M2 5.5c2.8-1 6-1 9 .8v14c-3-1.6-6.2-1.6-9-.6zM22 5.5c-2.8-1-6-1-9 .8v14c3-1.6 6.2-1.6 9-.6z"/></svg>',
  drop: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#b5b5b8"><path d="M12 3c3 4 6 7.3 6 11a6 6 0 0 1-12 0c0-3.7 3-7 6-11z"/></svg>',
  wine: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#b5b5b8"><path d="M7 3h10c0 5-1.5 8-5 8.6V19h3v2H9v-2h3v-7.4C8.5 11 7 8 7 3z"/></svg>',
  bread: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#b5b5b8"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M7 12h10" stroke="#1c1c1e" stroke-width="2"/></svg>',
  candle: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#b5b5b8"><path d="M12 2c1.4 1.8 2 3 2 4a2 2 0 0 1-4 0c0-1 .6-2.2 2-4zM10 10h4v9h-4zM6 19h12v3H6z"/></svg>',
  person: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#b5b5b8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
  silhouette: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.3"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 22c0-5 3.8-8.2 8.5-8.2s8.5 3.2 8.5 8.2"/></svg>',
  chev: '<svg class="chev" width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-linecap="round"><path d="M2 2l7 7-7 7"/></svg>',
  down: '<svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="#147EFB" stroke-width="2" stroke-linecap="round"><path d="M1 1.5l5 5 5-5"/></svg>',
  cal: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#147EFB" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><g fill="#147EFB" stroke="none"><circle cx="8" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="16" cy="14" r="1"/><circle cx="8" cy="17.5" r="1"/><circle cx="12" cy="17.5" r="1"/></g></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  addUser: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="14" cy="8" r="4"/><path d="M6 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5zM2 9h6M5 6v6"/></svg>',
  bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff9f0a" stroke-width="1.9" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></svg>',
  caret: '<svg width="14" height="10" viewBox="0 0 14 10" fill="#147EFB"><path d="M0 0h14L7 10z"/></svg>',
  arrow: '<svg width="48" height="14" viewBox="0 0 48 14" fill="none" stroke="#666" stroke-width="2"><path d="M0 7h44M38 1l6 6-6 6"/></svg>',
  xBadge: '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#ff3b30" stroke="#1c1c1e" stroke-width="3"/><path d="M9 9l8 8M17 9l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
  checkBadge: '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#28A745" stroke="#1c1c1e" stroke-width="3"/><path d="M8 13.5l3.2 3.2L18 10" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
  cross: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M5 9h14"/></svg>',
  moon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5"><path d="M20 15A8.5 8.5 0 0 1 9 4a8.5 8.5 0 1 0 11 11z"/></svg>',
  candleOutline: '<svg width="26" height="26" viewBox="0 0 24 24" fill="#ddd"><path d="M12 3c1.2 1.5 1.7 2.4 1.7 3.2a1.7 1.7 0 0 1-3.4 0c0-.8.5-1.7 1.7-3.2zM10.5 10h3v8h-3zM6 18h12v2.5H6z"/></svg>',
  calSolid: '<svg width="32" height="32" viewBox="0 0 24 24" fill="#147EFB"><path d="M7 2h2v2h6V2h2v2h2a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h2zM4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9z"/></svg>',
  okCircle: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M7.5 12.3l3 3 6-6.3" stroke="#28A745" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
  helpCircle: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4" stroke="#E68A00" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="#E68A00"/></svg>',
  xCircle: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round"/></svg>',
  lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="rgba(255,255,255,.4)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>',
};
const TAB = {
  home: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M12 3l10 9h-3v9h-5v-6h-4v6H5v-9H2z"/></svg>`,
  learn: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M6 2h13a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5a1.5 1.5 0 0 0 0 3H19v-1.5h1V23H6.5A3.5 3.5 0 0 1 3 19.5V5a3 3 0 0 1 3-3zm2 4v2h9V6zm0 4v2h7v-2z"/></svg>`,
  edit: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M3 17.3V21h3.7L18 9.6 14.4 6zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8L18.9 8.8z"/></svg>`,
  gear: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>`,
};

/* ---------- Chrome builders ---------- */
const statusBar = () => `<div class="status"><div class="time">9:41</div><div class="island"></div><div class="icons">
  <svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></svg>
  <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.5a10 10 0 0 1 7 2.8l1.2-1.3A11.8 11.8 0 0 0 8.5.7 11.8 11.8 0 0 0 .3 4l1.2 1.3a10 10 0 0 1 7-2.8zm0 3.6a6.4 6.4 0 0 1 4.5 1.8l1.2-1.3a8.2 8.2 0 0 0-11.4 0L4 7.9a6.4 6.4 0 0 1 4.5-1.8zm0 3.5a2.8 2.8 0 0 1 2 .8L8.5 12.3l-2-1.9a2.8 2.8 0 0 1 2-.8z"/></svg>
  <svg width="28" height="13" viewBox="0 0 28 13"><rect x=".5" y=".5" width="24" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="21" height="9" rx="2.5" fill="#fff"/><path d="M26 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="#fff" fill-opacity=".4"/></svg>
</div></div>`;
const navBar = title => `<div class="navbar"><span class="burger">${I.burger}</span>${title}</div>`;
const tabBar = active => `<div class="tabbar">${['home','learn','edit','gear'].map(k => TAB[k](k === active ? '#147EFB' : '#8a8a8e')).join('')}</div>`;
const homeBar = () => `<div class="homebar"></div>`;
const avatar = (size, who) => who
  ? `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size*.38}px;background:linear-gradient(135deg,${who[1]},${who[2]})">${who[0]}</div>`
  : `<div class="avatar ph" style="width:${size}px;height:${size}px">${I.silhouette}</div>`;

/* ---------- Placeholder people (fictional) ---------- */
const READINGS = [
  ['Matins Gospel', 'Mark Youssef'], ['Third Hour Gospel', 'Peter Hanna'], ['Sixth Hour Gospel', 'John Mikhail'],
  ['Pauline Epistle', 'Philip Botros'], ['Catholic Epistle', 'Stephen Awad'], ['Praxis', 'Daniel Shenouda'], ['Gospel', 'Matthew Gerges'],
];

/* ---------- Screens ---------- */
function homeContent() {
  return `<div class="content">
    <div style="text-align:center;font-size:34px;font-weight:300;line-height:1.24;margin:24px 0 8px;letter-spacing:.3px">Services of Week<br>10-18-26</div>
    <div class="section-title">Readings</div>
    ${READINGS.map(([r, n]) => `<div class="card row">${I.book}<span>${r}: ${n}</span></div>`).join('')}
    <div class="section-title" style="margin-top:26px">Offering of the Lamb</div>
    <div class="card row">${I.drop}<span>Water: Andrew Tadros</span></div>
    <div class="card row">${I.wine}<span>Wine: Thomas Iskander</span></div>
  </div>`;
}
const SCREENS = {
  home: () => statusBar() + navBar('Deacon Service Schedule') + homeContent() + tabBar('home') + homeBar(),

  scheduled: () => statusBar() + navBar('Deacon Service Schedule') + homeContent() + tabBar('home') + `<div class="dim"></div>
    <div class="modal" style="top:150px">
      <div style="text-align:center;padding:28px 24px 18px">
        <div style="width:64px;height:64px;border-radius:50%;background:rgba(20,126,251,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">${I.calSolid}</div>
        <div style="font-size:20px;font-weight:600;margin-bottom:8px">You're Scheduled</div>
        <div style="font-size:15px;color:rgba(255,255,255,.6);font-weight:500;margin-bottom:12px">Week of 10-18-26</div>
        <div style="font-size:26px;font-weight:700;color:#147EFB">Pauline Epistle</div>
      </div>
      <div style="padding:8px 22px 20px">
        <div style="font-size:18px;font-weight:600;text-align:center;margin-bottom:18px">Will you be attending?</div>
        ${[['#28A745', I.okCircle, 'I will be there', 'Confirm attendance'], ['#E68A00', I.helpCircle, 'Unsure yet', 'Still deciding'], ['#ff3b30', I.xCircle, 'Unavailable', 'Cannot attend']].map(([c, ic, t, s]) => `
          <div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 14px;margin-bottom:10px">
            <div style="width:46px;height:46px;border-radius:12px;background:${c};display:flex;align-items:center;justify-content:center">${ic.replace(/fill="#fff"/, 'fill="none"').replace(/stroke="#(28A745|E68A00|ff3b30)"/g, 'stroke="#fff"').replace(/fill="#E68A00"/, 'fill="#fff"')}</div>
            <div style="flex:1"><div style="font-size:16.5px;font-weight:600">${t}</div><div style="font-size:13.5px;color:rgba(255,255,255,.5);margin-top:2px">${s}</div></div>${I.chev}
          </div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-top:1px solid rgba(255,255,255,.06);font-size:12.5px;color:rgba(255,255,255,.4)">${I.lock}Only visible to church admins and you</div>
    </div>` + homeBar(),

  edit: () => statusBar() + navBar('Edit Schedule') + `<div class="content">
    <div class="card" style="display:flex;align-items:center;padding:20px 20px;margin-top:20px">
      <div><div style="font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.55);font-weight:500">WEEK OF</div><div style="font-size:19px;font-weight:600;margin-top:6px">Sunday, Oct 18, 2026</div></div>
      <div style="margin-left:auto;width:36px;height:36px;border-radius:50%;background:#2a2a2c;display:flex;align-items:center;justify-content:center">${I.caret}</div>
    </div>
    <div style="font-size:23px;font-weight:600;color:#3b9dff;margin:34px 0 14px">Assign Readers</div>
    ${[['Matins Gospel', 'Mark Youssef', 'c'], ['Third Hour Gospel', 'Peter Hanna', 'c'], ['Sixth Hour Gospel', 'John Mikhail', 'b'], ['Pauline Epistle', 'Philip Botros', 'c'], ['Catholic Epistle', 'Stephen Awad', 'b'], ['Praxis', 'Daniel Shenouda', 'b']].map(([r, n, s]) => `
      <div class="card" style="display:flex;align-items:center;gap:8px;height:74px;padding:0 18px;margin-bottom:12px">
        <div style="flex:1;min-width:0"><div style="font-size:16.5px;font-weight:600">${r}</div>${s === 'c' ? '<div style="font-size:13.5px;color:#34c759;font-weight:500;margin-top:4px;display:flex;align-items:center;gap:7px"><span style="width:7px;height:7px;border-radius:50%;background:#34c759"></span>Confirmed</div>' : ''}</div>
        ${s === 'b' ? `<div style="width:40px;height:40px;border-radius:11px;background:#3a2a12;display:flex;align-items:center;justify-content:center">${I.bell}</div>` : ''}
        <div style="background:#2a2a2c;border:1px solid #3a3a3c;border-radius:11px;height:40px;padding:0 15px;display:flex;align-items:center;font-size:15.5px;color:rgba(255,255,255,.8)">${n}</div>
      </div>`).join('')}
    <div style="position:absolute;left:20px;right:20px;bottom:20px;height:51px;border-radius:14px;background:#147EFB;display:flex;align-items:center;justify-content:center;font-size:16.5px;font-weight:600">Add Extra Altar Server</div>
  </div>` + tabBar('edit') + homeBar(),
